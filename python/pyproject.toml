[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kira-spliceqc"
version = "0.5.0"
description = "Python wrapper for the kira-spliceqc binary: run splicing QC and get an AnnData back"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Andrei Riaskov" }]
keywords = ["single-cell", "splicing", "quality-control", "anndata", "scverse"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
]
dependencies = ["anndata>=0.10", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
tenx = ["scanpy>=1.10"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/ARyaskov/kira-spliceqc"
Documentation = "https://aryaskov.github.io/kira-spliceqc/"

[project.scripts]
kira-spliceqc-py = "kira_spliceqc.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["kira_spliceqc"]
