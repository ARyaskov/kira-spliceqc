[book]
title = "kira-spliceqc"
description = "Deterministic, explainable splicing QC for single-cell RNA-seq"
authors = ["Andrei Riaskov"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
git-repository-url = "https://github.com/ARyaskov/kira-spliceqc"
edit-url-template = "https://github.com/ARyaskov/kira-spliceqc/edit/main/docs/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
mathjax-support = true

[output.html.search]
limit-results = 20
